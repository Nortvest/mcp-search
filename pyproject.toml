[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["*"]

[project]
name = "mcp-search"
version = "0.1.0"
description = "Self-hosted MCP server for internet search with pluggable search engines"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastmcp>=0.1.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "httpx>=0.27.0",
    "fake-useragent>=1.4.0",
    "html2text>=2020.1.16",
    "readability-lxml>=0.8.4.1",
    "sumy>=0.12.0",
    "langdetect>=1.0.9",
    "numpy>=1.26.0",
]

[dependency-groups]
dev = [
    "ruff>=0.15.0",
    "mypy>=1.10.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]

[tool.ruff]
target-version = "py313"
line-length = 120

[tool.mypy]
python_version = "3.13"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[[tool.mypy.overrides]]
module = ["sumy.*", "langdetect.*", "readability.*", "lxml.etree", "nltk.*"]
ignore_missing_imports = true
