name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up uv
        uses: astral-sh/setup-uv@v8.0.0
        with:
          enable-cache: true
      - name: Run ruff
        run: uv run ruff check .

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up uv
        uses: astral-sh/setup-uv@v8.0.0
        with:
          enable-cache: true
      - name: Run mypy
        run: uv run mypy .

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up uv
        uses: astral-sh/setup-uv@v8.0.0
        with:
          enable-cache: true
      - name: Cache nltk data
        uses: actions/cache@v5
        with:
          path: ~/.cache/nltk
          key: nltk-cache-${{ hashFiles('**/pyproject.toml') }}
          restore-keys: |
            nltk-cache-
      - name: Install punkt_tab
        run: uv run python -c "import nltk; nltk.download('punkt_tab')"
      - name: Run tests
        run: uv run pytest
